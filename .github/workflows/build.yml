name: Windows validation only (no publication)

on:
  push:
  pull_request:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test and publish
        shell: powershell
        run: .\scripts\publish.ps1
